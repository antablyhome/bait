<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'self'; worker-src 'self'; frame-src https://script.google.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E5B43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميزانية البيت">
<title>ميزانية البيت</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frameBox">
  <iframe id="app" title="ميزانية البيت" referrerpolicy="no-referrer" allow="clipboard-write; web-share"></iframe>
</div>

<div id="splash" class="screen">
  <img src="icons/icon-192.png" alt="" width="96" height="96">
  <p>ميزانية البيت</p>
  <span class="dots"><i></i><i></i><i></i></span>
</div>

<div id="offline" class="screen" hidden>
  <img src="icons/icon-192.png" alt="" width="72" height="72">
  <p>مفيش إنترنت دلوقتي</p>
  <small>البرنامج محتاج نت عشان يجيب الأرقام من الشيت.</small>
  <button id="retry" type="button">جرّب تاني</button>
</div>

<script src="app.js"></script>
</body>
</html>
